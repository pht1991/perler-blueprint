name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# peaceiris 方案直接 push 到 gh-pages 分支，不依赖 environment，
# 从而绕过 github-pages 环境的分支保护白名单（sign-renderer 同款方案）。
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          cname: perler.phtbyte.com
